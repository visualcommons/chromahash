# cargo-mutants configuration for the chromahash core crate.
# Run the sweep with `mise run mutants:rust` (full) or `mise run mutants:rust:diff`
# (changed lines only); see TESTING.md § Mutation Testing.

# Drop the default `spec-vectors` feature so the `spec_vectors` integration test
# (gated by required-features in Cargo.toml) is skipped: it reads the sibling
# ../spec/test-vectors dir, which cargo-mutants' isolated per-crate build does
# not stage, so it can't compile here. The encode/decode pipeline is pinned for
# the sweep by the self-contained golden unit tests in src/encode.rs and
# src/decode.rs instead.
no_default_features = true

# Build the sweep with the `mutants` profile: optimized (the sweep re-runs the
# whole suite once per mutant, ~2000 of them, and the suite is dominated by
# tier-4 decodes at ~0.7s each in a debug build) but with overflow and debug
# assertions kept on.
#
# Plain `release` is *not* equivalent here. It masks arithmetic that debug traps
# on, which changes which mutants are killable: `(bitpos + i) % 8` -> `+ 8` in
# `bitpack.rs` is caught in debug, where the shift panics, and survives in
# release, where `1u8 << 11` quietly becomes `1u8 << 3`. A sweep on `release`
# reports those as equivalent mutants when they are nothing of the sort.
# See `[profile.mutants]` in rust/Cargo.toml.
profile = "mutants"

# Re-enable `simd` plus the opt-in `simd-diff-tests` (both dropped above with the
# defaults) so the host-runnable SIMD backends — AVX2/SSE2 on the x86_64 sweep
# host — and the generic SIMD math are actually built and exercised by the
# per-backend differential tests, giving them real mutation coverage rather than
# silently falling back to scalar. (The sweep host must therefore be AVX2-capable;
# the avx2 test asserts the feature is present rather than skipping.)
features = ["simd", "simd-diff-tests", "research-render"]

# `research-render` is in that list for a different reason than the SIMD pair.
# cargo-mutants does not evaluate `#[cfg(feature = ...)]`, so it generates
# mutants for feature-gated code whether or not the feature is on — and when it
# is off the mutated code is never compiled, the build is unchanged, and every
# mutant is reported MISSED. That is what `stage_timing` is excluded for below.
#
# The difference is that `decode_at_size_to_with` and
# `ChromaHash::decode_at_size_tuned` have real tests (the three agreement
# properties in src/decode.rs), so enabling the feature makes their 24 mutants
# genuinely killable rather than exempt. Prefer a test over an exclusion, as this
# file says a few lines down.

# …but the aarch64-NEON and wasm32-simd128 backends are `cfg`-gated to those
# architectures, so on the x86_64 sweep host their source never compiles and no
# mutant in them can be killed — every one would be a spurious MISS. They are
# verified instead by the per-arch differential tests (CI's aarch64 job for NEON,
# the wasm32 job under wasmtime for simd128) and the cross-target compile checks.
exclude_globs = ["src/simd/neon.rs", "src/simd/wasm.rs"]

# Exclusions — each line is a mutant that cannot be killed by any test because
# the mutation is *equivalent* (produces identical observable behaviour) or only
# affects resource cleanup. Keep this list short and justified; prefer adding a
# test over an exclusion.
exclude_re = [
    # `if scale < 1e-10` floors near-constant channels to exact zero. No input
    # lands a channel's peak |AC| exactly on 1e-10 (solids ~1e-15, detail ≫1e-10),
    # so `<` and `<=` are indistinguishable.
    "src/dct.rs.*replace < with <= in dct_encode_selected",
    # `if ratio > 1.0` picks the landscape branch. decode_aspect(byte) is 2^k for
    # k = byte/255*8 - 4, which equals 1.0 only at the non-integer byte 127.5, so
    # ratio is never exactly 1.0 and `>` vs `>=` are equivalent over all 256
    # bytes. `no_aspect_byte_decodes_to_exactly_one` asserts that premise, so
    # these two exclusions rest on a test rather than on this comment.
    "src/aspect.rs.*replace > with >= in decode_output_size",
    "src/aspect.rs.*replace > with >= in base_output_size",
    # Drop joins the worker threads; replacing it with a no-op leaks threads but
    # leaves every batch result byte-identical, so no functional test can observe it.
    "src/batch.rs.*replace <impl Drop for BatchEncoder>::drop with \\(\\)",

    # Header (de)packing ORs each field into a disjoint bit/byte range, so `|` and
    # `^` produce identical results — the values are clamped to fit their fields,
    # so no two ever share a set bit. The golden hashes pin the packed result.
    "replace \\| with \\^ in encode_with",
    "replace \\| with \\^ in read_aspect",
    "replace \\| with \\^ in render_at_size",
    "replace \\| with \\^ in average_color_with",

    # The decode-aware DC search scans the *symmetric* offset set {0, -1, 1}, so
    # negating an offset (`l0 + dl` → `l0 - dl`) scans the same three candidates
    # in a different order. `<` is strict, so a reordering changes the winner only
    # on an exact tie, where both orders keep an equally good code.
    #
    # `delete - in select_dc_codes` and `replace < with <= in select_dc_codes`
    # used to be excluded here on the same reasoning. They are not equivalent —
    # `select_dc_codes_searches_l_neighbors` kills both — so they are gone.
    "replace \\+ with - in select_dc_codes",
    # `l_hi = (1 << l_dc_bits) - 1` is the L candidate's clamp ceiling. Widening
    # it to 128 is reachable only when `l0` is already 127, which needs
    # `l_mean >= 1`; there the target is clipped to white and code 128 decodes to
    # that same clipped white, so it is an exact tie and the strict `<` keeps 127.
    #
    # Anchored to the L line. The a/b analogues two lines below are *not*
    # equivalent — `select_dc_codes_never_exceeds_its_field_width` kills both —
    # and an unanchored version of this pattern excluded them too, silently
    # widening a one-mutant exemption to three. That is the exact failure mode
    # this list exists to prevent, so keep every entry as narrow as it can be.
    #
    # The line number makes this brittle, but it fails in the safe direction: if
    # encode.rs shifts, the anchor stops matching and the sweep reports one extra
    # missed mutant rather than quietly exempting a new one.
    "src/encode.rs:63:39.*replace - with (\\+|/) in select_dc_codes",

    # `stage_timing` (src/encode.rs) is behind the off-by-default
    # `bench-internals` feature, which this sweep does not enable — see the
    # feature list above. cargo-mutants mutates the function bodies anyway
    # because it does not evaluate `#[cfg(feature = ...)]`, but the mutated code
    # is never compiled in, so the build is unchanged and every mutant is
    # reported MISSED rather than unviable. Unkillable by construction, exactly
    # like the NEON and wasm backends excluded by `exclude_globs` above: the
    # code is not part of the artifact this sweep tests. It is measurement-only
    # (no shipped path reaches it) and `nm` confirms the symbol is absent from a
    # default release build.
    "replace stage_timing::reset with \\(\\)",
    "replace stage_timing::mark with \\(\\)",
    "replace stage_timing::take .* with vec!",

    # Numeric kernels. portable_ln / portable_exp range-reduce in a loop: operator
    # mutations either re-converge to the same value (the series is invariant to
    # which 2^k bracket is chosen) or never terminate (timeouts). The remaining
    # comparisons guard the x==0 / boundary cases the early returns already handle.
    # All are pinned by the exact known-value tests in this module; mutation adds
    # no signal. (cbrt_signed is also retained only for those tests.)
    "src/math_utils.rs.* in portable_ln",
    "src/math_utils.rs.* in portable_exp",
    "replace < with <= in portable_cos",
    "replace > with >= in portable_cos",
    "replace < with <= in cbrt_halley",
    "replace > with >= in cbrt_signed",
    # mu_compress feeds portable_ln; these two mutations pass it a non-finite
    # argument (outside its x>0 domain), hanging in ln's reduction loop rather than
    # failing — a property of the kernel, not a test gap.
    "replace \\+ with - in mu_compress",
    "replace \\* with / in mu_compress",
]

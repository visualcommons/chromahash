# cargo-mutants configuration for the chromahash core crate.
# Run the sweep with `mise run mutants:rust` (full) or `mise run mutants:rust:diff`
# (changed lines only); see TESTING.md § Mutation Testing.

# Drop the default `spec-vectors` feature so the `spec_vectors` integration test
# (gated by required-features in Cargo.toml) is skipped: it reads the sibling
# ../spec/test-vectors dir, which cargo-mutants' isolated per-crate build does
# not stage, so it can't compile here. The encode/decode pipeline is pinned for
# the sweep by the self-contained golden unit tests in src/encode.rs and
# src/decode.rs instead.
no_default_features = true

# Build the sweep with the `mutants` profile: optimized (the sweep re-runs the
# whole suite once per mutant, ~2000 of them, and the suite is dominated by
# tier-4 decodes at ~0.7s each in a debug build) but with overflow and debug
# assertions kept on.
#
# Plain `release` is *not* equivalent here. It masks arithmetic that debug traps
# on, which changes which mutants are killable: `(bitpos + i) % 8` -> `+ 8` in
# `bitpack.rs` is caught in debug, where the shift panics, and survives in
# release, where `1u8 << 11` quietly becomes `1u8 << 3`. A sweep on `release`
# reports those as equivalent mutants when they are nothing of the sort.
# See `[profile.mutants]` in rust/Cargo.toml.
profile = "mutants"

# Re-enable `simd` plus the opt-in `simd-diff-tests` (both dropped above with the
# defaults) so the host-runnable SIMD backends — AVX2/SSE2 on the x86_64 sweep
# host — and the generic SIMD math are actually built and exercised by the
# per-backend differential tests, giving them real mutation coverage rather than
# silently falling back to scalar. (The sweep host must therefore be AVX2-capable;
# the avx2 test asserts the feature is present rather than skipping.)
features = ["simd", "simd-diff-tests", "research-render"]

# `research-render` is in that list for a different reason than the SIMD pair.
# cargo-mutants does not evaluate `#[cfg(feature = ...)]`, so it generates
# mutants for feature-gated code whether or not the feature is on — and when it
# is off the mutated code is never compiled, the build is unchanged, and every
# mutant is reported MISSED. That is what `stage_timing` is excluded for below.
#
# The difference is that `decode_at_size_to_with` and
# `ChromaHash::decode_at_size_tuned` have real tests (the three agreement
# properties in src/decode.rs), so enabling the feature makes their 24 mutants
# genuinely killable rather than exempt. Prefer a test over an exclusion, as this
# file says a few lines down.

# …but the aarch64-NEON and wasm32-simd128 backends are `cfg`-gated to those
# architectures, so on the x86_64 sweep host their source never compiles and no
# mutant in them can be killed — every one would be a spurious MISS. They are
# verified instead by the per-arch differential tests (CI's aarch64 job for NEON,
# the wasm32 job under wasmtime for simd128) and the cross-target compile checks.
exclude_globs = ["src/simd/neon.rs", "src/simd/wasm.rs"]

# Exclusions — each line is a mutant that cannot be killed by any test because
# the mutation is *equivalent* (produces identical observable behaviour) or only
# affects resource cleanup. Keep this list short and justified; prefer adding a
# test over an exclusion.
exclude_re = [
    # (The `scale < 1e-10` floors in src/dct.rs were excluded here as
    # unreachable at exactly 1e-10. They are not:
    # `scale_floor_keeps_a_channel_exactly_at_the_threshold` builds a channel
    # on the floor and kills `<=` in all three forward transforms.)
    #
    # The CfL gain fields are written only `if t.cfl_bits > 0`. At the shipped
    # `cfl_bits = 0`, `>=` writes two zero-width fields, which both bit writers
    # (`write_bits`, and `write_bits_word` for PERFORMANCE.md §12.1 item 7)
    # treat as no-ops, so the body is identical. Anchored to the write, not to
    # the CfL computation's own `cfl_bits > 0`, which is killable.
    "src/encode.rs:2097:19: replace > with >= in encode_parts",
    # `quantize_one`'s `ac_nearest` search scans the symmetric offsets
    # {0, -1, 1, -2, 2}, so `q + d` → `q - d` scans the same five candidates in
    # a different order — the reasoning of `select_dc_codes`' entry above.
    # With the strict `<`, order decides only an exact tie in reconstruction
    # error between two codes, which the uneven µ-law grid does not produce.
    # Anchored to the line.
    "src/encode.rs:995:30.*replace \\+ with - in quantize_one",
    # `if ratio > 1.0` picks the landscape branch. decode_aspect(byte) is 2^k for
    # k = byte/255*8 - 4, which equals 1.0 only at the non-integer byte 127.5, so
    # ratio is never exactly 1.0 and `>` vs `>=` are equivalent over all 256
    # bytes. `no_aspect_byte_decodes_to_exactly_one` asserts that premise, so
    # this exclusion rests on a test rather than on this comment. (Its twin
    # for `decode_output_size` matched nothing: that function now delegates
    # the comparison to `base_output_size`.)
    "src/aspect.rs:22:14: replace > with >= in base_output_size",
    # Drop joins the worker threads; replacing it with a no-op leaks threads but
    # leaves every batch result byte-identical, so no functional test can observe it.
    "src/batch.rs.*replace <impl Drop for BatchEncoder>::drop with \\(\\)",

    # Byte 0 ORs the version, the tier and the alpha flag into disjoint bit
    # ranges (the version and tier are clamped to fit their fields), so no two
    # ever share a set bit and `|` and `^` produce identical results. The
    # golden hashes pin the packed byte. Anchored to the two `|`s of that one
    # line: the unanchored per-function form this replaces had drifted onto
    # functions that no longer exist (`encode_with`, `read_aspect`,
    # `average_color_with`) and so matched nothing, while `render_at_size`
    # and `synthesize_detail` carry `|`/`&` sites that are killable.
    "src/encode.rs:2076:30: replace \\| with \\^ in encode_parts",
    "src/encode.rs:2076:55: replace \\| with \\^ in encode_parts",

    # The decode-aware DC search scans the *symmetric* offset set {0, -1, 1}, so
    # negating an offset (`l0 + dl` → `l0 - dl`) scans the same three candidates
    # in a different order. `<` is strict, so a reordering changes the winner only
    # on an exact tie, where both orders keep an equally good code.
    #
    # `delete - in select_dc_codes` and `replace < with <= in select_dc_codes`
    # used to be excluded here on the same reasoning. They are not equivalent —
    # `select_dc_codes_searches_l_neighbors` kills both — so they are gone.
    #
    # Anchored to the three offset lines. The unanchored form also matched the
    # two `+`s of the error sum `dr² + dg² + db²` below them, which are not
    # equivalent and which tests kill once unexcluded. An exact tie between
    # two distinct codes is not proven impossible; a seeded search over
    # 40,000 small images at `Tunables::DEFAULT` found none for any of the
    # three offsets.
    "src/encode.rs:110:31: replace \\+ with - in select_dc_codes",
    "src/encode.rs:111:31: replace \\+ with - in select_dc_codes",
    "src/encode.rs:112:31: replace \\+ with - in select_dc_codes",
    # (The L candidate's clamp ceiling used to be excluded here: widening it
    # alone is equivalent. All three ceilings now come from one helper,
    # `dc_code_ceiling`, whose mutants `select_dc_codes_never_exceeds_its_field_width`
    # kills through the a and b channels, so there is no L-only mutant left.)
    #
    # Line anchors below are brittle, but they fail in the safe direction: if a
    # file shifts, the anchor stops matching and the sweep reports one extra
    # missed mutant rather than quietly exempting a new one.

    # `stage_timing` (src/encode.rs) is behind the off-by-default
    # `bench-internals` feature, which this sweep does not enable — see the
    # feature list above. cargo-mutants mutates the function bodies anyway
    # because it does not evaluate `#[cfg(feature = ...)]`, but the mutated code
    # is never compiled in, so the build is unchanged and every mutant is
    # reported MISSED rather than unviable. Unkillable by construction, exactly
    # like the NEON and wasm backends excluded by `exclude_globs` above: the
    # code is not part of the artifact this sweep tests. It is measurement-only
    # (no shipped path reaches it) and `nm` confirms the symbol is absent from a
    # default release build.
    "replace stage_timing::reset with \\(\\)",
    "replace stage_timing::mark with \\(\\)",
    "replace stage_timing::take .* with vec!",

    # Numeric kernels. (portable_ln and portable_exp were excluded whole, and
    # mu_compress's two mutations with them, as "re-converging or never
    # terminating". Swept without the exclusions, all but one of their ~90
    # mutants were caught; the rest hung in an unbounded loop. Those loops are
    # now bounded `for`s, `kernels_are_exact_at_their_boundaries` kills the
    # one survivor, and the exclusions are gone. cbrt_signed is now
    # `#[cfg(test)]`, which is all it was ever used by.)
    #
    # `cbrt_halley` returns on `x == 0.0` (which -0.0 also equals) before it
    # tests `x < 0.0`, so `<=` is the same test.
    "src/math_utils.rs:138:18: replace < with <= in cbrt_halley",
    # portable_cos folds x > π to 2π - x. At x = π exactly that is π again
    # (2π and π are one exponent apart, so the subtraction is exact), so
    # `>` and `>=` give the same x. `kernels_are_exact_at_their_boundaries`
    # asserts that premise.
    "src/math_utils.rs:198:10: replace > with >= in portable_cos",

    # ── Equivalent mutants left by the #119 sweep ───────────────────────────
    #
    # Every other survivor that sweep reported is now killed by a test. These
    # cannot be, and each comment is the proof. All are line-anchored, so a
    # shifted line fails safe (one extra MISSED, never a silent new exemption).

    # (The deadzone guard `deadzone > 0.0 && |n| < deadzone` in `quantize_one`
    # and `compand_quantize`, and `gamma_of`'s second clamp, used to be
    # excluded here as never deciding anything. They are gone from the code
    # instead, as is `render_at_size`'s always-true `if i < l_count`.)
    # `quantize_one`'s search scans q + {0, -1, 1, -2, 2}; deleting the minus on
    # -2 drops candidate q-2, which can never win. q is the companded-nearest
    # code, so the value lies at or above level q-1, and every family's levels
    # rise with the code (a `Table` codebook is the positive half of a
    # symmetric quantizer, and its q is already the nearest level outright).
    # So q-2 is never nearer than q-1, which is scored first, and the strict
    # `<` keeps the earlier of two equal errors.
    "src/encode.rs:994:28: delete - in quantize_one",
    # `encode_parts` refines only `if t.refine_passes > 0`. With `>=` it also
    # calls `refine_codes` at 0 passes, whose loop `for _ in 0..refine_passes`
    # then never runs: it builds a reconstruction and writes nothing back.
    "src/encode.rs:1999:24: replace > with >= in encode_parts",
    # A-law expand's knee: at x = 1/(1 + ln A) the linear segment is t/A and
    # the log one exp(t - 1)/A with t = x·(1 + ln A) within an ulp of 1, where
    # portable_exp(t - 1) rounds to t. `a_law_expand_segments_agree_at_the_knee`
    # asserts it bit for bit over A in [1.01, 200.99], so this rests on a test.
    # (The compress knee is *not* equivalent; a test pins its owner.)
    "src/mulaw.rs:123:20: replace < with <= in a_law_expand",
    # `table_dequantize` has already returned on `offset == 0` when it tests
    # `offset < 0`, so `<=` is the same test.
    "src/mulaw.rs:186:15: replace < with <= in table_dequantize",
    # Detail synthesis is gated on `synth_count > 0`. At synth_count == 0,
    # `synthesize_detail` takes zero extra coefficients and returns its input
    # unchanged (its `ext.coeffs.len() <= l_count` early return), so `>=` is
    # the same render.
    "src/decode.rs:465:42: replace > with >= in render_at_size",

    # ── `refine_codes`: research-only, mostly unproven ─────────────────────
    #
    # Pixel-domain refinement is off in `Tunables::DEFAULT` (`refine_passes =
    # 0`) and reachable only through the comparison harness's sweep. Its code
    # paths are pinned by `refinement_goldens`,
    # `band_gain_refine_cfl_and_shared_scale_goldens` (passes, ±2 moves, DC and
    # scale refinement, the decoder-raster target, the convergence break) and
    # `refinement_keeps_a_code_on_an_exact_tie` (a tie with the current code
    # keeps it, for scale, DC and AC moves) and `refinement_edge_goldens`.
    # What those leave is below. Only the first entry is a proof; the rest
    # rest on a measurement, and are research-only.

    # Equivalent: the `live` test is `cx < src.0 && cy < src.1 && cx < w &&
    # cy < h`. With `refine_grid = 0`, (w, h) *is* src, so `cx < w` repeats
    # `cx < src.0`; with `refine_grid = 1`, (w, h) is the decoder raster the
    # selection is drawn from, so every selected pair has cx < w and cy < h.
    # Either way the last two conjuncts never decide, and `<=` cannot differ.
    "src/encode.rs:1385:40: replace < with <= in refine_codes",
    "src/encode.rs:1385:50: replace < with <= in refine_codes",
    # (`cx < src.0` → `<=`, the scale search's offset order and its `<=`, and
    # the DC search's `e < be` → `==` were excluded here as unproven. None was
    # equivalent: `refinement_edge_goldens` carries an input for each, found
    # by a seeded search over 3,000 small images and every refinement knob.)
    #
    # Unproven, research-only (refine_passes = 0 in Tunables::DEFAULT): tie
    # order between two improving candidates. Each candidate set is symmetric
    # ({±1} for DC, ±d for AC), so `cur + d` → `cur - d` only reorders it, and
    # `<=` in the second-candidate test (`e < be`) only changes which of two
    # equally improving candidates wins. Both differ only when two distinct
    # codes give exactly the same pixel-domain SSE *below* the current one.
    # The scale search has such a tie (`refinement_edge_goldens`), so it is
    # not impossible; for these four, the same seeded search over 40,000 small
    # images under every refinement knob found none. Measured, not proven.
    "src/encode.rs:1467:44: replace \\+ with - in refine_codes",
    "src/encode.rs:1508:48: replace \\+ with - in refine_codes",
    "src/encode.rs:1520:84: replace < with <= in refine_codes",
    # Unproven, research-only (refine_passes = 0 in Tunables::DEFAULT): the DC
    # second-candidate test `e < be` → `<=`, which differs only when both DC
    # neighbours improve equally (the `==` mutant, which differs whenever the
    # second is strictly better, is killed by `refinement_edge_goldens`).
    #
    # For refine_obj = 1 (plain OKLAB SSE) both are equivalent. A DC move adds
    # the same delta to every pixel of one channel, the DC grid is uniform
    # (step s), and that channel's SSE is a quadratic in the delta, so over N
    # pixels f(cur + 1) + f(cur - 1) - 2·f(cur) = 2·N·s² > 0, far above
    # rounding error. The two neighbours cannot both be below f(cur), the
    # second test is never reached with a strict improvement in hand, and
    # `<`, `<=` and `==` all answer false. (This assumes accel_sse_early_exit
    # off; with it on, the second candidate's SSE may be a partial sum, which
    # `==`/`<=` could match only if it landed exactly on `be`.)
    #
    # For refine_obj = 0, 2 and 3 the clip and the gamma LUT break the
    # quadratic, so both neighbours can improve; an *equal* improvement from
    # both is what `<=` needs, and the 40,000-image search above found none.
    "src/encode.rs:1479:80: replace < with <= in refine_codes",
]

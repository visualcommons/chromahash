[package]
name = "chromahash"
version = "0.7.2"
authors = ["Justin Chung <noreply@justinchung.net>"]
edition = "2024"
rust-version = "1.85"
description = "Modern, high-quality image placeholder representation (LQIP) for professional photo management at scale"
license = "MIT OR Apache-2.0"
repository = "https://github.com/visualcommons/chromahash"
homepage = "https://github.com/visualcommons/chromahash"
documentation = "https://docs.rs/chromahash"
readme = "README.md"
keywords = ["image", "placeholder", "lqip", "thumbnail", "preview"]
categories = ["multimedia::images", "encoding", "compression"]

[dependencies]

[features]
# `spec-vectors` (on by default) enables the integration golden test
# `tests/spec_vectors.rs`, which reads ../spec/test-vectors. It's a no-op for
# library consumers — it only gates a dev test target. cargo-mutants builds with
# --no-default-features so it skips that target: the sweep stages only the rust/
# crate, without the sibling spec/ dir, so the test couldn't compile there. The
# encode/decode pipeline is pinned for the sweep by the self-contained golden
# unit tests in src/encode.rs and src/decode.rs instead. See rust/mutants.toml.
default = ["spec-vectors", "simd"]
spec-vectors = []

# `simd` (on by default) enables the hand-written `core::arch` SIMD backends for
# the hot per-pixel color math (AVX2/SSE2 on x86, NEON on aarch64, simd128 on
# wasm), selected at runtime (x86) or compile time (others). It adds no
# dependencies and no public API: output is byte-identical to the scalar path,
# which is always retained as the fallback. Build `--no-default-features` (or
# without `simd`) for a pure-scalar build — e.g. the scalar WASM artifact or a
# conservative target. See `src/simd/`.
simd = []

# `simd-diff-tests` (off by default) compiles the per-backend SIMD differential
# tests in `src/simd/` — each pins one *specific* vector backend (AVX2, SSE2,
# NEON, wasm simd128) against the scalar reference. It is a dev/CI-only switch
# with no library API and implies `simd`. Two properties make it worth a flag of
# its own: it is platform-specific (each backend only compiles for its target,
# so coverage means running — or emulating — every target), and unlike a plain
# `cargo test` it *fails* rather than skips on a host that cannot execute a
# backend it was asked to validate, so a mis-targeted run can never pass with
# zero coverage. CI runs it per machine target; locally use `mise run test:simd:diff`
# (native) or `mise run test:simd:emulated` (every target via QEMU/wasmtime).
simd-diff-tests = ["simd"]

# `bench-internals` (off by default) compiles the per-stage timing in
# `src/encode.rs` and the `bench_stages` example that reads it, so
# `mise run benchmark:stages` can say where encode time actually goes. It adds
# no dependency and no default-build API: with the feature off the `stage!`
# marks expand to nothing, so the shipped build contains none of it. Deliberately
# NOT part of `full` — `full` means "test everything", and this is a measurement
# switch with no tests of its own. It is also absent from the cargo-mutants
# feature set (rust/.cargo/mutants.toml), so it adds no mutants to the hot path.
bench-internals = []

# `research-render` (off by default) exposes `ChromaHash::decode_at_size_tuned`
# — a render at an arbitrary target raster rather than at (or capped below) the
# natural one, plus the `render` subcommand of the `encode_stdin` example. The
# renderer has always been able to do this: `render_at_size` evaluates the cosine
# basis pointwise at whatever grid it is handed, and every public entry point
# either uses the natural raster or takes a per-axis `min` against it. Nothing
# could ask it to go *up*.
#
# It is a feature rather than plain API because the comparison harness needs it
# to answer one question — whether the artifacts a reader sees in a placeholder
# are the format's own reconstruction or the browser's interpolation of a 32 px
# raster — and that question should not cost the bindings a new entry point in
# nine languages before it has an answer. Same contract as `bench-internals`: no
# default-build API, no dependency, no binding exposes it. If the measurement
# says rendering at display size is worth having, it graduates to real API in
# every language at once, which is what `AGENTS.md` requires.
#
# Cost is why this is not simply on: the render is `O(w·h·K)`, so a 512 px render
# of a 32 px natural raster is ~256x the per-pixel work. See `spec/PERFORMANCE.md`.
research-render = []

# `full` turns on every feature — the default set plus the opt-in
# `simd-diff-tests` and `research-render` — for "test everything" invocations
# (CI and `mise run test`).
#
# `research-render` is in and `bench-internals` is out, on the rule stated above:
# `full` means "test everything", and `bench-internals` has no tests of its own
# while `research-render` does — the three agreement properties in
# `src/decode.rs` are what make it a measurement rather than a second decoder,
# and they are worth nothing unless CI runs them.
full = ["spec-vectors", "simd", "simd-diff-tests", "research-render"]

[[test]]
name = "spec_vectors"
required-features = ["spec-vectors"]

[[example]]
name = "bench_stages"
required-features = ["bench-internals"]

[dev-dependencies]
# Test-only: randomized property tests for the invariants the golden vectors
# cannot catch, because the vectors are regenerated by the same code they pin.
# Not `default-features`: the `fork`/`timeout` harness spawns processes per case,
# which is a poor fit for a pure-computation suite. The published crate stays
# dependency-free — proptest never enters the runtime graph.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# Test-only: parse the shared spec test vectors and assert the reference
# implementation reproduces them byte-for-byte. The published crate stays
# dependency-free — serde_json never enters the runtime graph. Mirrors the
# golden-vector tests in the binding crates (bindings/c, bindings/uniffi, ...).
#
# `float_roundtrip`: serde_json's default float parser is a fast approximation
# that can land 1 ULP away from Rust's own `str::parse::<f64>()` — measured on
# `0.9999999802873053`, which appears verbatim in unit-color.json. The unit
# vectors pin numeric kernels bit-exactly, so a parser that shifts the expected
# value by one bit makes the assertion untestable. The integration vectors are
# unaffected (they are integer byte arrays).
serde_json = { version = "1", features = ["float_roundtrip"] }

# Profile for the cargo-mutants sweep (see rust/.cargo/mutants.toml).
#
# Optimized, because the sweep re-runs the whole suite once per mutant and the
# suite is dominated by tier-4 decodes — ~20x faster than a debug build.
#
# But with `overflow-checks` back on, because release silently masks arithmetic
# that debug traps on, and that *changes which mutants are killable*. Measured:
# the `(bitpos + i) % 8` -> `+ 8` mutants in `bitpack.rs` are caught in debug
# (the shift panics) and survive in release, where `1u8 << 11` quietly becomes
# `1u8 << 3`. A sweep that reports those as equivalent is measuring the build
# profile, not the tests.
[profile.mutants]
inherits = "release"
overflow-checks = true
debug-assertions = true

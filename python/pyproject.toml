[project]
name = "chromahash"
version = "0.7.2"
description = "Modern, high-quality image placeholder representation (LQIP) for professional photo management at scale"
readme = "README.md"
authors = [{ name = "Justin Chung", email = "noreply@justinchung.net" }]
license = "MIT OR Apache-2.0"
keywords = ["image", "placeholder", "lqip", "thumbnail", "preview"]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/visualcommons/chromahash"
Repository = "https://github.com/visualcommons/chromahash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The native cdylib + generated ctypes bindings are gitignored build outputs
# (staged by `mise run cbuild:python` / the release matrix), but they MUST ship in the
# wheel — hatchling excludes VCS-ignored files by default, so force-include them.
# Each wheel carries exactly one platform's lib; the release workflow re-tags the
# wheel's platform accordingly.
[tool.hatch.build.targets.wheel]
artifacts = [
    "chromahash/_uniffi.py",
    "chromahash/libchromahash_uniffi.*",
    "chromahash/chromahash_uniffi.dll",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated UniFFI bindings — not hand-maintained, regenerated by `mise run cbuild:python`.
extend-exclude = ["chromahash/_uniffi.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
